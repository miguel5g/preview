<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catsuc 3D Preview</title>
<style>
  :root { --bg:#eef0f5; --panel:#ffffffe6; --text:#1b1d24; --muted:#666c7a; --accent:#284bf0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; }
  .panel { position:fixed; top:16px; left:16px; width:260px; max-width:calc(100% - 32px); background:var(--panel); backdrop-filter:blur(8px); border-radius:12px; padding:16px; box-shadow:0 4px 24px #0002; font-size:14px; }
  .panel h1 { font-size:16px; margin:0 0 12px; }
  label { display:flex; justify-content:space-between; align-items:center; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=color] { width:40px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
  .row { display:flex; gap:8px; margin-top:12px; }
  button { flex:1; padding:8px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.alt { background:#e3e6ee; color:var(--text); }
  .dims { margin-top:12px; padding-top:10px; border-top:1px solid #0001; color:var(--muted); font-size:13px; }
  .hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--panel); padding:8px 14px; border-radius:999px; font-size:13px; color:var(--muted); white-space:nowrap; }
  @media (max-width:600px){ .panel{ top:auto; bottom:56px; } .hint{ font-size:11px; } }
</style>
</head>
<body>
<div id="app"></div>

<div class="panel">
  <h1>Catsuc — Preview 3D</h1>
  <label>Largura <span id="wVal"></span></label>
  <input id="width" type="range" min="50" max="400" step="5" value="150">
  <label>Espessura <span id="dVal"></span></label>
  <input id="depth" type="range" min="1" max="20" step="0.5" value="5">
  <label>Chanfro nas bordas <span id="bVal"></span></label>
  <input id="bevel" type="range" min="0" max="1" step="0.1" value="0.3">
  <label>Cor do filamento <input id="color" type="color" value="#284bf0"></label>
  <label>Mesa de impressão <input id="bed" type="checkbox" checked></label>
  <label>Girar automaticamente <input id="spin" type="checkbox"></label>
  <div class="row">
    <button id="front">Frente</button>
    <button id="reset" class="alt">Resetar vista</button>
  </div>
  <div class="dims" id="dims"></div>
</div>

<div class="hint">Arraste para girar · Scroll/pinça para zoom · Botão direito (ou 2 dedos) para mover</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SRC_W = 1376, SRC_H = 230; // dimensões do logo original (px)
const $ = id => document.getElementById(id);

// --- cena ---
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f5);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 30;
controls.maxDistance = 1500;

const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-150, 300, 250);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-300, right:300, top:300, bottom:-300, near:1, far:1000 });
scene.add(sun, new THREE.AmbientLight(0xffffff, 0.3));

// mesa de impressão (unidades = mm)
const bed = new THREE.Group();
const plate = new THREE.Mesh(new THREE.BoxGeometry(450, 4, 450), new THREE.MeshStandardMaterial({ color:0x2a2d33, roughness:0.6, metalness:0.2 }));
plate.position.y = -2; plate.receiveShadow = true;
const grid = new THREE.GridHelper(450, 45, 0x555a66, 0x3a3e46);
grid.position.y = 0.05;
bed.add(plate, grid);
scene.add(bed);

// --- logo ---
const shapes = new SVGLoader().parse($('logo-svg').outerHTML).paths.flatMap(p => SVGLoader.createShapes(p));
const material = new THREE.MeshPhysicalMaterial({ color:$('color').value, roughness:0.45, metalness:0, clearcoat:0.15 });
const logo = new THREE.Mesh(undefined, material);
logo.castShadow = logo.receiveShadow = true;
scene.add(logo);

function build() {
  const widthMM = +$('width').value, depthMM = +$('depth').value, bevelMM = +$('bevel').value;
  const s = widthMM / SRC_W;
  const b = Math.min(bevelMM, depthMM / 3) / s; // chanfro em px do SVG
  const geo = new THREE.ExtrudeGeometry(shapes, {
    depth: Math.max(depthMM / s - 2 * b, 0.01), bevelEnabled: b > 0,
    bevelThickness: b, bevelSize: b, bevelOffset: -b, bevelSegments: 3, curveSegments: 8,
  });
  // SVG tem Y para baixo: centraliza, inverte Y e escala para mm
  geo.translate(-SRC_W / 2, -SRC_H / 2, b);
  geo.scale(s, -s, s);
  geo.computeVertexNormals();
  if (logo.geometry) logo.geometry.dispose();
  logo.geometry = geo;

  // em pé sobre a mesa
  logo.rotation.set(0, 0, 0);
  logo.position.set(0, SRC_H * s / 2, -depthMM / 2);

  $('wVal').textContent = widthMM + ' mm';
  $('dVal').textContent = depthMM + ' mm';
  $('bVal').textContent = bevelMM + ' mm';
  $('dims').innerHTML = `Tamanho final: <b>${widthMM} × ${(SRC_H * s).toFixed(1)} × ${depthMM} mm</b><br>(L × A × P)`;
}

function frame(front) {
  const w = +$('width').value, h = w * SRC_H / SRC_W;
  const dist = w * 1.6;
  controls.target.set(0, h / 2, 0);
  camera.position.set(front ? 0 : -w * 0.55, h / 2 + (front ? 0 : w * 0.35), front ? dist : dist * 0.85);
  controls.update();
}

['width','depth','bevel'].forEach(id => $(id).addEventListener('input', build));
$('width').addEventListener('change', () => frame(false));
$('color').addEventListener('input', e => material.color.set(e.target.value));
$('bed').addEventListener('change', e => bed.visible = e.target.checked);
$('spin').addEventListener('change', e => controls.autoRotate = e.target.checked);
$('front').onclick = () => frame(true);
$('reset').onclick = () => frame(false);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

build(); resize(); frame(false);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
