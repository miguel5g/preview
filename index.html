<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catsuc 3D Preview</title>
<style>
  :root { --panel:#ffffffeb; --text:#1b1d24; --muted:#666c7a; --accent:#284bf0; --line:#0000001a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#e9e4dc; color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; }
  .panel { position:fixed; top:16px; left:16px; width:280px; max-width:calc(100% - 32px); max-height:calc(100% - 80px); overflow:auto; background:var(--panel); backdrop-filter:blur(10px); border-radius:14px; padding:16px; box-shadow:0 6px 30px #0002; font-size:14px; }
  .panel h1 { font-size:16px; margin:0 0 12px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; }
  .models { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .models button { padding:9px 6px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--text); font:inherit; font-size:13px; cursor:pointer; }
  .models button.on { border-color:var(--accent); background:#284bf014; color:var(--accent); font-weight:600; }
  .desc { color:var(--muted); font-size:12.5px; margin:8px 0 0; line-height:1.4; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:10px 0 4px; white-space:nowrap; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=color] { width:28px; height:28px; border:none; background:none; padding:0; cursor:pointer; }
  .swatches { display:flex; gap:6px; align-items:center; }
  .sw { width:24px; height:24px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row button { flex:1; padding:8px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .row button.alt { background:#e3e6ee; color:var(--text); }
  .dims { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
  .hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--panel); padding:8px 14px; border-radius:999px; font-size:13px; color:var(--muted); white-space:nowrap; }
  @media (max-width:600px){ .panel{ top:auto; bottom:56px; max-height:45%; } .hint{ font-size:11px; } }
</style>
</head>
<body>
<div id="app"></div>

<div class="panel">
  <h1>Catsuc — Objeto de mesa</h1>
  <div class="models" id="models">
    <button data-m="plate" class="on">Placa de mesa</button>
    <button data-m="tile">Bloco do ícone</button>
    <button data-m="pens">Porta-canetas</button>
    <button data-m="sign">Letreiro</button>
  </div>
  <p class="desc" id="desc"></p>

  <h2>Cores</h2>
  <label>Corpo <span class="swatches" id="bodySw"><input id="bodyColor" type="color" value="#f2f1ee"></span></label>
  <label>Logo <span class="swatches" id="logoSw"><input id="logoColor" type="color" value="#284bf0"></span></label>

  <h2>Tamanho</h2>
  <label>Escala <span id="kVal"></span></label>
  <input id="scale" type="range" min="60" max="160" step="5" value="100">
  <label>Relevo da logo <span id="rVal"></span></label>
  <input id="relief" type="range" min="1" max="6" step="0.5" value="2.5">

  <h2>Cena</h2>
  <label>Ambiente
    <select id="env">
      <option value="desk">Mesa de escritório</option>
      <option value="bed">Mesa de impressão</option>
    </select>
  </label>
  <label>Girar automaticamente <input id="spin" type="checkbox"></label>
  <div class="row">
    <button id="front">Frente</button>
    <button id="reset" class="alt">Resetar vista</button>
  </div>
  <div class="dims" id="dims"></div>
</div>

<div class="hint">Arraste para girar · Scroll/pinça para zoom · Botão direito (ou 2 dedos) para mover</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;

// ---------- cena ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e4dc);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 1, 8000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 40;
controls.maxDistance = 1500;
controls.maxPolarAngle = 88 * DEG; // não passa por baixo da mesa

const sun = new THREE.DirectionalLight(0xfff4e6, 2.2);
sun.position.set(-180, 320, 220);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left:-250, right:250, top:250, bottom:-250, near:1, far:1200 });
scene.add(sun, new THREE.AmbientLight(0xffffff, 0.25));

// mesa de madeira (textura procedural)
function woodTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#b8895c'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 260; i++) {
    const y = Math.random() * 1024, a = Math.random() * 0.12;
    g.strokeStyle = Math.random() < 0.5 ? `rgba(90,55,25,${a})` : `rgba(235,200,150,${a})`;
    g.lineWidth = 1 + Math.random() * 5;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= 1024; x += 64) g.lineTo(x, y + Math.sin(x / 180 + i) * 6);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  t.anisotropy = 8;
  return t;
}
const desk = new THREE.Mesh(new THREE.CircleGeometry(900, 64), new THREE.MeshStandardMaterial({ map:woodTexture(), roughness:0.55 }));
desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true;
scene.add(desk);

// mesa de impressão (unidades = mm)
const bed = new THREE.Group();
const plate = new THREE.Mesh(new THREE.BoxGeometry(350, 4, 350), new THREE.MeshStandardMaterial({ color:0x2a2d33, roughness:0.6, metalness:0.2 }));
plate.position.y = -2; plate.receiveShadow = true;
const grid = new THREE.GridHelper(350, 35, 0x555a66, 0x3a3e46);
grid.position.y = 0.05;
bed.add(plate, grid);
bed.visible = false;
scene.add(bed);

// ---------- materiais ----------
const bodyMat = new THREE.MeshPhysicalMaterial({ roughness:0.55, clearcoat:0.1 });
const logoMat = new THREE.MeshPhysicalMaterial({ roughness:0.35, clearcoat:0.3 });
function setColor(mat, hex) {
  mat.color.set(hex);
  mat.metalness = hex.toLowerCase() === '#c9a14a' ? 0.7 : 0; // dourado "silk"
}
const BODY_SW = ['#f2f1ee', '#1e1f24', '#8a8f98', '#284bf0'];
const LOGO_SW = ['#284bf0', '#f2f1ee', '#1e1f24', '#c9a14a'];
function swatches(el, input, list, mat) {
  for (const hex of list) {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = hex; b.title = hex;
    b.onclick = () => { input.value = hex; setColor(mat, hex); };
    el.insertBefore(b, input);
  }
  input.addEventListener('input', () => setColor(mat, input.value));
  setColor(mat, input.value);
}
swatches($('bodySw'), $('bodyColor'), BODY_SW, bodyMat);
swatches($('logoSw'), $('logoColor'), LOGO_SW, logoMat);

// ---------- geometria ----------
const loadShapes = id => new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="${$(id).getAttribute('d')}"/></svg>`)
  .paths.flatMap(p => SVGLoader.createShapes(p));
const SHAPES = { icon:loadShapes('icon-path'), word:loadShapes('word-path'), mold:loadShapes('mold-path') };
SHAPES.logo = [...SHAPES.icon, ...SHAPES.word];

function bbox(shapes) {
  const b = new THREE.Box2();
  shapes.forEach(s => s.getPoints().forEach(p => b.expandByPoint(p)));
  return b;
}

// extruda shapes do SVG (Y para baixo) com largura em mm; centro em (0,0), face de trás em z=0
function svgMesh(shapes, widthMM, depthMM, mat, bevelMM = 0.3, frame = shapes) {
  const bb = bbox(frame);
  const s = widthMM / (bb.max.x - bb.min.x);
  const b = Math.min(bevelMM, depthMM / 3) / s;
  const geo = new THREE.ExtrudeGeometry(shapes, {
    depth: Math.max(depthMM / s - 2 * b, 0.01), bevelEnabled: b > 0,
    bevelThickness: b, bevelSize: b, bevelOffset: -b, bevelSegments: 3, curveSegments: 8,
  });
  geo.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, b);
  // espelha Y e Z juntos (= rotação): inverter só Y viraria as faces do avesso
  geo.scale(s, -s, -s);
  geo.translate(0, 0, depthMM);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.userData.h = (bb.max.y - bb.min.y) * s;
  return m;
}
const aspect = shapes => { const b = bbox(shapes); return (b.max.y - b.min.y) / (b.max.x - b.min.x); };

function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function extrudeShape(shape, depth, mat, bevel = 1) {
  const b = Math.min(bevel, depth / 3);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth - 2 * b, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelOffset: -b, bevelSegments: 4, curveSegments: 16,
  });
  geo.translate(0, 0, b);
  return new THREE.Mesh(geo, mat);
}
// caixa arredondada apoiada em y=0, centrada em x/z
function roundedBox(w, h, d, r, mat) {
  const m = extrudeShape(roundedRect(w, d, r), h, mat, Math.min(1.2, h / 3));
  m.rotation.x = -Math.PI / 2; // extrusão para cima
  return m;
}

// ---------- modelos ----------
const MODELS = {
  plate: {
    desc: 'Placa inclinada para a frente da mesa, com a logo completa em relevo. Imprime deitada de lado.',
    build(k, relief) {
      const g = new THREE.Group();
      const logoW = 150 * k, logoH = logoW * aspect(SHAPES.logo);
      const W = logoW + 28 * k, A = 68 * DEG;
      const L = logoH + 22 * k;                  // comprimento da face inclinada
      const H = L * Math.sin(A), zt = L * Math.cos(A), D = Math.max(zt + 14 * k, 38 * k);
      // perfil trapezoidal (u = -z do mundo, v = y), extrudado ao longo de x
      const prof = new THREE.Shape();
      prof.moveTo(-D / 2, 0); prof.lineTo(-D / 2 + zt, H); prof.lineTo(D / 2, H); prof.lineTo(D / 2, 0); prof.closePath();
      const body = extrudeShape(prof, W, bodyMat, 1.2 * k);
      body.geometry.translate(0, 0, -W / 2);
      body.rotation.y = Math.PI / 2;
      g.add(body);
      // logo sobre a face inclinada
      const logo = svgMesh(SHAPES.logo, logoW, relief, logoMat);
      const n = new THREE.Vector3(0, zt, H).normalize();
      logo.rotation.x = -(Math.PI / 2 - A);
      logo.position.set(0, H / 2, D / 2 - zt / 2).addScaledVector(n, -0.2);
      g.add(logo);
      // filete na parte de cima
      const strip = roundedBox(W - 16 * k, 1.2, 3 * k, 1.2, logoMat);
      strip.position.set(0, H, -zt / 2); // centro do topo plano
      g.add(strip);
      return g;
    },
  },

  tile: {
    desc: 'Placa quadrada com o ícone em destaque e o nome embaixo, levemente inclinada sobre um pé. Visual de troféu/prêmio.',
    build(k, relief) {
      const g = new THREE.Group();
      const T = 80 * k, thk = 12 * k, footH = 8 * k, lean = 12 * DEG;
      const foot = roundedBox(T + 16 * k, footH, 36 * k, 6 * k, bodyMat);
      foot.position.z = 18 * k;
      g.add(foot);

      const tile = new THREE.Group();
      const slab = extrudeShape(roundedRect(T, T, 10 * k), thk, bodyMat, 1.5 * k);
      slab.position.y = T / 2;
      tile.add(slab);
      const iw = 0.46 * T, ih = iw * aspect(SHAPES.icon);
      const ww = 0.62 * T, wh = ww * aspect(SHAPES.word), gap = 0.07 * T;
      const total = ih + gap + wh;
      const icon = svgMesh(SHAPES.icon, iw, relief * 1.4, logoMat);
      icon.position.set(0, T / 2 + total / 2 - ih / 2, thk - 0.2);
      const word = svgMesh(SHAPES.word, ww, relief * 0.7, logoMat);
      word.position.set(0, T / 2 - total / 2 + wh / 2, thk - 0.2);
      tile.add(icon, word);
      tile.rotation.x = -lean;
      tile.position.set(0, footH - 3 * k, 10 * k);
      g.add(tile);
      return g;
    },
  },

  pens: {
    desc: 'Porta-canetas de cantos arredondados, com o ícone grande na frente e o nome embaixo. Útil e sempre à vista.',
    build(k, relief) {
      const g = new THREE.Group();
      const S = 78 * k, Hc = 105 * k, wall = 3 * k, r = 14 * k;
      const outer = roundedRect(S, S, r);
      outer.holes.push(roundedRect(S - 2 * wall, S - 2 * wall, r - wall));
      const tube = extrudeShape(outer, Hc, bodyMat, 1 * k);
      tube.rotation.x = -Math.PI / 2;
      const floor = roundedBox(S - wall, 3 * k, S - wall, r - wall / 2, bodyMat);
      g.add(tube, floor);
      const iw = 0.42 * S;
      const icon = svgMesh(SHAPES.icon, iw, relief * 1.2, logoMat);
      icon.position.set(0, Hc * 0.6, S / 2 - 0.2);
      const word = svgMesh(SHAPES.word, 0.74 * S, relief * 0.7, logoMat);
      word.position.set(0, Hc * 0.24, S / 2 - 0.2);
      g.add(icon, word);
      // canetas para dar escala
      const penMats = [0x1e1f24, 0x284bf0, 0xe8e8e8].map(c => new THREE.MeshStandardMaterial({ color:c, roughness:0.4 }));
      [[-12, -8, 6, 4], [8, 6, -5, -7], [14, -14, 3, 9]].forEach(([x, z, rx, rz], i) => {
        const pen = new THREE.Mesh(new THREE.CylinderGeometry(4.5 * k, 4.5 * k, 140 * k, 16), penMats[i]);
        pen.position.set(x * k, 70 * k, z * k);
        pen.rotation.set(rx * DEG, 0, rz * DEG);
        pen.castShadow = true;
        pen.userData.prop = true;
        g.add(pen);
      });
      return g;
    },
  },

  sign: {
    desc: 'Letreiro com a logo sobre um contorno que une todas as letras, apoiado num pé discreto.',
    build(k, relief) {
      const g = new THREE.Group();
      const logoW = 160 * k, moldT = 4 * k;
      // o contorno usa a mesma escala da logo (enquadra pela logo)
      const mold = svgMesh(SHAPES.mold, logoW, moldT, bodyMat, 0.6 * k, SHAPES.logo);
      const logo = svgMesh(SHAPES.logo, logoW, relief, logoMat);
      logo.position.z = moldT - 0.2;
      const face = new THREE.Group();
      face.add(mold, logo);
      const moldBB = new THREE.Box3().setFromObject(mold);
      face.position.set(0, -moldBB.min.y + 4 * k, -moldT / 2);
      const foot = roundedBox(logoW * 0.9, 7 * k, 34 * k, 6 * k, bodyMat);
      g.add(foot, face);
      return g;
    },
  },
};

// ---------- montagem ----------
let current = 'plate', model = null;
function build() {
  const k = +$('scale').value / 100, relief = +$('relief').value;
  if (model) {
    scene.remove(model);
    model.traverse(o => o.geometry?.dispose());
  }
  model = MODELS[current].build(k, relief);
  model.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
  // centraliza na mesa
  const box = new THREE.Box3();
  model.updateMatrixWorld(true);
  model.traverse(o => { if (o.isMesh && !o.userData.prop) box.expandByObject(o); });
  model.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
  scene.add(model);
  applyEnv();
  model.userData.size = box.getSize(new THREE.Vector3());

  const sz = model.userData.size;
  $('kVal').textContent = Math.round(k * 100) + '%';
  $('rVal').textContent = relief + ' mm';
  $('desc').textContent = MODELS[current].desc;
  $('dims').innerHTML = `Tamanho final: <b>${sz.x.toFixed(0)} × ${sz.y.toFixed(0)} × ${sz.z.toFixed(0)} mm</b><br>(L × A × P)`;
}

function frame(front) {
  const sz = model.userData.size, m = Math.max(sz.x, sz.y * 1.6);
  const dist = m * 2.1 + 60;
  const off = innerWidth > 900 ? -m * 0.18 : 0; // não esconder atrás do painel
  controls.target.set(off, sz.y * 0.45, 0);
  camera.position.set(off + (front ? 0 : -dist * 0.45), sz.y * 0.45 + (front ? dist * 0.12 : dist * 0.4), front ? dist : dist * 0.8);
  controls.update();
}

$('models').addEventListener('click', e => {
  const m = e.target.dataset.m;
  if (!m) return;
  current = m;
  document.querySelectorAll('#models button').forEach(b => b.classList.toggle('on', b === e.target));
  build(); frame(false);
});
['scale', 'relief'].forEach(id => $(id).addEventListener('input', build));
$('scale').addEventListener('change', () => frame(false));
function applyEnv() {
  const isBed = $('env').value === 'bed';
  bed.visible = isBed; desk.visible = !isBed;
  scene.background.set(isBed ? 0xeef0f5 : 0xe9e4dc);
  model.traverse(o => { if (o.userData.prop) o.visible = !isBed; }); // canetas só na mesa
}
$('env').addEventListener('input', applyEnv);
$('spin').addEventListener('change', e => controls.autoRotate = e.target.checked);
$('front').onclick = () => frame(true);
$('reset').onclick = () => frame(false);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

build(); resize(); frame(false);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
